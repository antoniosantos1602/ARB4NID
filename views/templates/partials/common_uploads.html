<div class="row mb-5 justify-content-center g-4"> <div class="col-md-5">
        <div class="upload-card">
            <div class="card-header-icon mb-3">
                <i class="bi bi-file-earmark-bar-graph text-teal"></i>
            </div>
            <label class="form-label section-title" style="font-size: 1rem;">Test Set (CSV)</label>
            <label class="custom-file-upload">
                <i class="bi bi-upload"></i> Upload Test Data
                <input type="file" id="testFile" name="test_dataset" accept=".csv" required onchange="updateFileName('testFile', 'testFileName')">
            </label>
            <span id="testFileName" class="file-name-text">No files selected</span>
        </div>
    </div>

    <div class="col-md-5">
        <div class="upload-card">
            <div class="card-header-icon mb-3">
                <i class="bi bi-cpu text-teal"></i>
            </div>
            <label class="form-label section-title" style="font-size: 1rem;">Model (.joblib)</label>
            <label class="custom-file-upload">
                <i class="bi bi-upload"></i> Upload Model
                <input type="file" id="modelFile" name="model[]" accept=".joblib" multiple required onchange="updateFileName('modelFile', 'modelFileName')">
            </label>
            <span id="modelFileName" class="file-name-text">No files selected</span>
        </div>
    </div>

</div>
