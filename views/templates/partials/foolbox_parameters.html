<div class="form-check mb-2 mt-3">

    FGM (L2 Fast Gradient Method)

</div>
<div class="collapse" id="fb_fgm_params">

<script>
document.addEventListener("DOMContentLoaded", function () {
  document.querySelectorAll('input[name="selected_attacks"]').forEach(input => {
    input.addEventListener('change', () => {
      const checked = document.querySelector('input[name="selected_attacks"]:checked');
      document.getElementById('foolbox_attack_type_hidden').value = checked ? checked.value : "";
    });
  });
});
</script>
